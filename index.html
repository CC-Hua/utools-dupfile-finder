th,td{border-bottom:1px solid var(--line);padding:8px 11px;vertical-align:top}

td.mono,td:nth-child(2){word-break:break-all}
td:first-child{color:#94a3b8;white-space:nowrap}

.list-block li{padding:2px 0}
.list-block .empty{color:#94a3b8;font-size:13px}
details{border:1px solid var(--line);border-radius:10px;margin-top:14px;background:#fbfdff}
summary{cursor:pointer;padding:11px 14px;font-weight:700;color:var(--accent);font-size:14px}
